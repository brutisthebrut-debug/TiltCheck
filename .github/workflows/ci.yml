name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tiltcheck-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Check deployment smoke script
        run: node --check ./scripts/src/deployment-smoke.mjs

      - name: Run web unit tests
        run: pnpm --filter @workspace/edgeboard run test

      - name: Build workspace
        env:
          BASE_PATH: /
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZSQ
        run: pnpm run build

  # API integration tests intentionally remain outside the default CI job for
  # now because the existing suite is destructive by design and expects a
  # dedicated Postgres database. See docs/DEPLOYMENT.md before enabling them.
