kind = "web"
previewPath = "/"
title = "EdgeBoard"
version = "1.0.0"
id = "artifacts/edgeboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25474

[services.development]
run = "pnpm --filter @workspace/edgeboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edgeboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/edgeboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25474"
BASE_PATH = "/"
