          description: >-
            0–100 — how well stated confidence matched results on settled
            won/lost plays inside the window (Brier-based, confidence/10 read
            as implied win probability). Null with no won/lost plays.
        postmortemRate:
          type: ["number", "null"]
          description: >-
            Percent of settled plays inside the window with a completed
            post-mortem (reasoning graded, miss reason set, or notes written).
            Null with no settled plays.
        soundRate:
          type: ["number", "null"]
          description: >-
            Percent of reasoning-graded plays inside the window the bettor
            called sound. Null when nothing was graded.
      required: [rank, userId, userName, avatarColor, wins, losses, pushes, settledCount, profit, totalWagered, roi, inPlayCount, currentStreak, currentStreakType, badges, calibrationScore, postmortemRate, soundRate]

    BadgeRef:
      type: object
      description: Compact badge reference for showing chips beside a bettor's name
      properties:
        id:
          type: string
        name:
          type: string
        emoji:
          type: string
      required: [id, name, emoji]

    BadgeStatus:
      type: object
      description: A badge definition plus whether/when this bettor earned it
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        emoji:
          type: string
        earnedAt:
          type: ["string", "null"]
          description: ISO timestamp when earned, null when not yet earned
      required: [id, name, description, emoji, earnedAt]

    RecapPlay:
      type: object
      description: One notable play inside the recap week
      properties:
        type:
          type: string
          enum: [bet, parlay]
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        title:
          type: string
        odds:
          type: integer
          description: American odds of the play
        amount:
          type: number
          description: Net result in dollars (positive win, negative loss)
        reasoningQuality:
          type: ["string", "null"]
          enum: [sound, flawed, null]
          description: The bettor's own post-mortem grade of the reasoning behind this play, when they recorded one
      required: [type, id, userId, userName, title, odds, amount]

    RecapLeak:
      type: object
      description: The week's most expensive pattern, plainly stated
      properties:
        kind:
          type: string
          enum: [sport, miss_reason, parlays]
        label:
          type: string
          description: The sport name, miss-reason code, or "parlays"
        amount:
          type: number
          description: Net dollars lost to this pattern in the week (negative)
        count:
          type: integer
          description: Number of losing plays behind it
      required: [kind, label, amount, count]

    RecapNarrative:
      type: object
      description: AI-narrated review of a bettor's week, cached per user per week
      properties:
        weekStart:
          type: string
          description: Monday of the reviewed week (YYYY-MM-DD, UTC)
        narrative:
          type: ["string", "null"]
          description: >-
            The written review, or null when the week had no activity or
            generation is unavailable
        limitReached:
          type: boolean
          description: >-
            True when the narrative is null because the bettor used up today's
            budget for generating older weeks' reviews. Already-generated weeks
            are unaffected — they always serve from the cache.
      required: [weekStart, narrative]

    WeeklyRecap:
      type: object
      description: One week's story — personal facts plus crew highlights
      properties:
        weekStart:
          type: string
          description: Monday of the recap week (YYYY-MM-DD, UTC)
        weekEnd:
          type: string
          description: Sunday of the recap week (YYYY-MM-DD, UTC)
        personal:
          type: object
          properties:
            userId:
              type: integer
            loggedCount:
              type: integer
              description: Plays logged during the week
            settledCount:
              type: integer
            wins:
              type: integer
            losses:
              type: integer
            pushes:
              type: integer
            profit:
              type: number
            totalWagered:
              type: number
            roi:
              type: number
            bestWin:
              oneOf:
                - $ref: "#/components/schemas/RecapPlay"
                - type: "null"
            worstBeat:
              oneOf:
                - $ref: "#/components/schemas/RecapPlay"
                - type: "null"
            leak:
              oneOf:
                - $ref: "#/components/schemas/RecapLeak"
                - type: "null"
          required: [userId, loggedCount, settledCount, wins, losses, pushes, profit, totalWagered, roi, bestWin, worstBeat, leak]
        crew:
          type: object
          description: Group highlights across every member's settled plays in the week
          properties:
            winner:
              oneOf:
                - type: object
                  properties:
                    userId:
                      type: integer
                    userName:
                      type: string
                    profit:
                      type: number
                    wins:
                      type: integer
                    losses:
                      type: integer
                  required: [userId, userName, profit, wins, losses]
                - type: "null"
            biggestUpset:
              oneOf:
                - $ref: "#/components/schemas/RecapPlay"
                - type: "null"
            worstBeat:
              oneOf:
                - $ref: "#/components/schemas/RecapPlay"
                - type: "null"
          required: [winner, biggestUpset, worstBeat]
      required: [weekStart, weekEnd, personal, crew]

    StreaksSummary:
      type: object
      description: Habit streaks computed from logged plays (UTC calendar days)
      properties:
        userId:
          type: integer
        loggingStreakDays:
          type: integer
          description: Consecutive days with at least one play logged, ending today or yesterday
        longestLoggingStreakDays:
          type: integer
        settleStreakDays:
          type: integer
          description: Consecutive days (ending today) with no finished game left ungraded
        overdueCount:
          type: integer
          description: Pending plays whose games are already over, right now
      required: [userId, loggingStreakDays, longestLoggingStreakDays, settleStreakDays, overdueCount]
