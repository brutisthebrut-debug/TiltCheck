        name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        totalBets:
          type: integer
        createdAt:
          type: string
      required: [id, name, members, totalBets, createdAt]

    MemberComparison:
      type: object
      properties:
