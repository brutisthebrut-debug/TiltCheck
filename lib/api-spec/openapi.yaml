        totalBets:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        winRate:
          type: number
        roi:
          type: number
        totalProfit:
          type: number
        currentBankroll:
          type: number
        avgConfidence:
          type: number
        hotSport:
