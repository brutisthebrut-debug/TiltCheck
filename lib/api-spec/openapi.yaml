openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EdgeBoard - Sports bet tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bets
    description: Straight bet operations
  - name: parlays
    description: Parlay operations
  - name: bankroll
    description: Bankroll and transaction operations
  - name: stats
    description: Analytics and statistics
  - name: workspace
    description: Shared workspace operations
  - name: users
    description: User operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the signed-in user's bettor profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
        "404":
          description: Signed in but no bettor profile linked yet

  /users/me/recap-seen:
    post:
      operationId: markRecapSeen
      tags: [users]
      summary: Record that the signed-in user has seen the current week's recap
      description: >
        Stores the Monday of the most recently completed week (computed
        server-side, UTC) as the user's seen recap week, so the dashboard
        teaser stays hidden on every device once the recap is opened.
      responses:
        "200":
          description: Updated user with the seen week recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
        "404":
          description: Signed in but no bettor profile linked yet

  /users/unclaimed:
    get:
      operationId: listUnclaimedUsers
      tags: [users]
      summary: List bettor profiles not yet linked to a sign-in account
      responses:
        "200":
          description: Unclaimed profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/claim:
    post:
      operationId: claimProfile
      tags: [users]
      summary: Claim an existing bettor profile or create a fresh one for the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimProfileInput"
      responses:
        "200":
          description: Linked bettor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: >-
            Claim rejected — `error` is `not_invited` (email not on the
            BETA_ALLOWED_EMAILS allowlist, or the account has no email while an
            allowlist is configured) or `beta_full` (seat cap reached).
        "409":
          description: Profile already claimed or account already linked

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all workspace users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update the signed-in user's own profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Cannot update another user's profile
        "404":
          description: Not found

  /users/{id}/badges:
    get:
      operationId: getUserBadges
      tags: [users]
      summary: List all badge definitions with the user's earned status
      description: >
        Returns every badge the app defines, with earnedAt set for the ones
        this bettor has earned. Visiting this endpoint also awards any newly
        qualified badges (badges are never revoked).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Badge case
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeStatus"
        "404":
          description: User not found

  # ── Bets ──────────────────────────────────────────────────────────────────
  /bets:
    get:
      operationId: listBets
      tags: [bets]
      summary: List straight bets
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [pending, won, lost, push, void, null]
        - name: sport
          in: query
          schema:
            type: ["string", "null"]
        - name: sportsbook
          in: query
          schema:
            type: ["string", "null"]
        - name: q
          in: query
          description: Case-insensitive text search over event and pick
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          description: Earliest game date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          description: Latest game date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of bets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bet"
    post:
      operationId: createBet
      tags: [bets]
      summary: Create a new straight bet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetInput"
      responses:
        "201":
          description: Created bet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"

  /bets/{id}:
    get:
      operationId: getBet
      tags: [bets]
      summary: Get a single bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bet detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"
        "404":
          description: Not found
    patch:
      operationId: updateBet
      tags: [bets]
      summary: Update a bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetUpdate"
      responses:
        "200":
          description: Updated bet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"
    delete:
      operationId: deleteBet
      tags: [bets]
      summary: Delete a bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /bets/{id}/settle:
    patch:
      operationId: settleBet
      tags: [bets]
      summary: Record result and post-game review for a bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetSettlement"
      responses:
        "200":
          description: Settled bet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"

  # ── Parlays ───────────────────────────────────────────────────────────────
  /parlays:
    get:
      operationId: listParlays
      tags: [parlays]
      summary: List parlays
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [pending, won, lost, push, void, null]
        - name: sport
          in: query
          description: Match parlays with at least one leg in this sport
          schema:
            type: ["string", "null"]
        - name: sportsbook
          in: query
          schema:
            type: ["string", "null"]
        - name: q
          in: query
          description: Case-insensitive text search over parlay name and leg event/pick
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          description: Earliest creation date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          description: Latest creation date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of parlays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parlay"
    post:
      operationId: createParlay
      tags: [parlays]
      summary: Create a parlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlayInput"
      responses:
        "201":
          description: Created parlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"

  /parlays/{id}:
    get:
      operationId: getParlay
      tags: [parlays]
      summary: Get a parlay with its legs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Parlay detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
        "404":
          description: Not found
    patch:
      operationId: updateParlay
      tags: [parlays]
      summary: Update a parlay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlayUpdate"
      responses:
        "200":
          description: Updated parlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
    delete:
      operationId: deleteParlay
      tags: [parlays]
      summary: Delete a parlay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /parlays/{id}/legs/{legId}:
    patch:
      operationId: updateParlayLeg
      tags: [parlays]
      summary: Correct a pending parlay leg's odds and recompute the parlay's combined odds and payout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: legId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlayLegUpdate"
      responses:
        "200":
          description: Parlay with the corrected leg and recomputed combined odds/payout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
        "404":
          description: Parlay or leg not found
        "409":
          description: Parlay is already settled — its payout is part of the bankroll ledger and legs cannot be edited

  /parlays/{id}/settle:
    patch:
      operationId: settleParlay
      tags: [parlays]
      summary: Settle a parlay result and add review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlaySettlement"
      responses:
        "200":
          description: Settled parlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"

  /settlement/needs-settling:
    get:
      operationId: getNeedsSettling
      tags: [bets]
      summary: List the signed-in user's pending bets and parlays whose games are already over
      description: >
        Returns pending straight bets whose game date is before today, and
        pending parlays whose every leg's game date is before today, for the
        signed-in user only. Used to nudge bettors to settle finished games.
      responses:
        "200":
          description: Items awaiting settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsSettling"
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  # ── CSV exports ───────────────────────────────────────────────────────────
  /export/bets.csv:
    get:
      operationId: exportBetsCsv
      tags: [bets]
      summary: Download the signed-in user's straight bets as a CSV file
      description: >
        Returns every straight bet owned by the signed-in user as CSV with a
        header row, RFC 4180 escaping, and ISO dates. Ordered oldest-first so
        spreadsheets read chronologically.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  /export/parlays.csv:
    get:
      operationId: exportParlaysCsv
      tags: [parlays]
      summary: Download the signed-in user's parlays as a CSV file (one row per leg)
      description: >
        Returns every parlay owned by the signed-in user as CSV with one row
        per leg; parlay-level columns repeat on each leg row so spreadsheets
        can pivot on the parlay id.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  /export/bankroll.csv:
    get:
      operationId: exportTransactionsCsv
      tags: [bankroll]
      summary: Download the signed-in user's bankroll transactions as a CSV file
      description: >
        Returns the signed-in user's full bankroll ledger as CSV with a header
        row, RFC 4180 escaping, and ISO dates. Ordered oldest-first.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  # ── Bankroll ──────────────────────────────────────────────────────────────
  /bankroll:
    get:
      operationId: getBankroll
      tags: [bankroll]
      summary: Get current bankroll state for a user
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Bankroll state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bankroll"

  /bankroll/transactions:
    get:
      operationId: listTransactions
      tags: [bankroll]
      summary: List bankroll transactions
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [bankroll]
      summary: Add a bankroll transaction (deposit, withdraw, adjustment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  # ── Stats (wow endpoints) ─────────────────────────────────────────────────
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Overall performance summary for a user
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/by-sport:
    get:
      operationId: getStatsBySport
      tags: [stats]
      summary: Win/loss and ROI broken down by sport
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Stats by sport
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportStats"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Recent bets and parlays activity feed across the workspace
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /stats/confidence-analysis:
    get:
      operationId: getConfidenceAnalysis
      tags: [stats]
      summary: How well confidence scores predict outcomes
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Confidence analysis buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfidenceBucket"

  /stats/insights:
    get:
      operationId: getStatsInsights
      tags: [stats]
      summary: Post-result review insights (miss reasons, reasoning quality, recent notes)
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Review insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"

  /stats/recap:
    get:
      operationId: getWeeklyRecap
      tags: [stats]
      summary: Weekly recap facts for a bettor plus the crew's highlights
      description: >
        Computes recap facts for one Monday-to-Sunday week (UTC) from settled
        plays. Defaults to the signed-in bettor and the most recently
        completed week. weekStart accepts any date and snaps to its Monday;
        weeks after the last completed week are rejected.
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: weekStart
          in: query
          description: Any date inside the desired week (YYYY-MM-DD)
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Weekly recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyRecap"
        "400":
          description: Week not finished yet or invalid date

  /stats/streaks:
    get:
      operationId: getStreaks
      tags: [stats]
      summary: Logging streak and settle streak for a bettor
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Streaks summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreaksSummary"

  # ── Workspace ─────────────────────────────────────────────────────────────
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get workspace info and members
      responses:
        "200":
          description: Workspace with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspace/compare:
    get:
      operationId: compareWorkspaceMembers
      tags: [workspace]
      summary: Compare bets and stats between workspace members
      responses:
        "200":
          description: Member comparison data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberComparison"

  /workspace/leaderboard:
    get:
      operationId: getWorkspaceLeaderboard
      tags: [workspace]
      summary: Rank crew members by settled results over a time window
      description: >
        Ranks every workspace member by net profit (ties broken by ROI, then
        wins) using settled straight bets and parlays only — pending plays are
        reported as an "in play" count and never move the ranking. Rows saved
        with dead-zone odds are excluded the same way the stats endpoints
        exclude them. The window filters on settledAt: week = last 7 days,
        month = last 30 days, all = everything.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, all]
            default: all
      responses:
        "200":
          description: Ranked leaderboard rows, best record first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarColor:
          type: string
        startingBankroll:
          type: number
        createdAt:
          type: string
        recapSeenWeek:
          type: ["string", "null"]
          description: Monday (YYYY-MM-DD, UTC) of the last recap week this user opened, or null if never
      required: [id, username, displayName, avatarColor, startingBankroll, createdAt]

    ClaimProfileInput:
      type: object
      description: Provide userId to claim an existing unclaimed profile, or displayName to start fresh
      properties:
        userId:
          type: integer
        displayName:
          type: string
          minLength: 1

    UpdateUserInput:
      type: object
      description: All fields optional; only provided fields are updated
      properties:
        startingBankroll:
          type: number
          exclusiveMinimum: 0
        displayName:
          type: string
          minLength: 1
        avatarColor:
          type: string

    NeedsSettling:
      type: object
      required: [count, bets, parlays]
      properties:
        count:
          type: integer
          description: Total number of bets + parlays awaiting settlement
        bets:
          type: array
          items:
            $ref: "#/components/schemas/Bet"
        parlays:
          type: array
          items:
            $ref: "#/components/schemas/Parlay"

    Bet:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        sport:
          type: string
        event:
          type: string
        betType:
          type: string
          enum: [moneyline, spread, total, prop, futures]
        pick:
          type: string
        odds:
          type: integer
          description: American odds (e.g. -110, +150)
        stake:
          type: number
        potentialPayout:
          type: number
        actualPayout:
          type: ["number", "null"]
        status:
          type: string
          enum: [pending, won, lost, push, void]
        gameDate:
          type: string
        confidenceScore:
          type: integer
          description: 1-10 confidence rating
        rationale:
          type: ["string", "null"]
          description: Pre-game reasoning
        postGameReview:
          type: ["string", "null"]
          description: Post-game reflection
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
        settledAt:
          type: ["string", "null"]
        sportsbook:
          type: ["string", "null"]
        promoNote:
          type: ["string", "null"]
        reasoningQuality:
          type: ["string", "null"]
        whatHappened:
          type: ["string", "null"]
        missReason:
          type: ["string", "null"]
      required: [id, userId, sport, event, betType, pick, odds, stake, potentialPayout, status, gameDate, confidenceScore, createdAt]

    BetInput:
      type: object
      properties:
        userId:
          type: integer
        sport:
          type: string
          minLength: 1
        event:
          type: string
          minLength: 1
        betType:
          type: string
          enum: [moneyline, spread, total, prop, futures]
        pick:
          type: string
          minLength: 1
        odds:
          type: integer
          minimum: -100000
          maximum: 100000
