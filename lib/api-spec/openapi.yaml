    LeakProfile:
      type: object
      properties:
        settledCount:
          type: integer
          description: Settled straight bets counted toward the profile
        recentWindowDays:
          type: integer
          description: Length in days of the recent window used for every recent* figure
        avgStake:
          type: ["number", "null"]
          description: Average stake across settled straight bets (null under 5 samples)
        lastLossAt:
          type: ["string", "null"]
          description: ISO timestamp of the most recent settled loss (bet or parlay)
        worstSport:
          type: ["object", "null"]
          description: The sport losing the most money, when it has cost at least $50 over 5+ bets
          properties:
            sport:
              type: string
            netLoss:
              type: number
              description: Net loss in dollars (negative number)
            bets:
              type: integer
            recentNet:
              type: number
              description: Net dollars in this sport over the recent window (negative = still losing)
            recentBets:
              type: integer
              description: Settled bets in this sport inside the recent window
          required: [sport, netLoss, bets, recentNet, recentBets]
        overconfidence:
          type: ["object", "null"]
          description: Present when 7+ confidence plays hit under 45% across 5+ samples
          properties:
            winRate:
              type: number
              description: Win percentage of high-confidence (7+) settled plays
            sample:
              type: integer
            recentWinRate:
              type: ["number", "null"]
              description: Win percentage of high-confidence plays settled inside the recent window (null when none)
            recentSample:
              type: integer
              description: High-confidence plays settled inside the recent window
          required: [winRate, sample, recentWinRate, recentSample]
        topMissReason:
          type: ["object", "null"]
          description: Most common self-graded miss reason across settled losses (excluding normal variance)
          properties:
            reason:
              type: string
            count:
              type: integer
            netLoss:
              type: number
            recentCount:
              type: integer
              description: Losses graded with this reason inside the recent window
            recentNetLoss:
              type: number
              description: Dollars lost to this reason inside the recent window
          required: [reason, count, netLoss, recentCount, recentNetLoss]
        tiltSpiral:
          type: ["object", "null"]
          description: >-
            Present when the bettor looks mid-tilt right now: at least two
            settled losses inside the short window, followed by a burst of
            rapid plays at escalated stakes relative to their own baseline.
            Null when data is thin (needs a real avgStake baseline) or the
            pattern is absent.
          properties:
            windowHours:
              type: integer
              description: Length of the "right now" window the signal looks at
            recentLosses:
              type: integer
              description: Settled losses (bets + parlays) inside the window
            rapidPlays:
              type: integer
              description: Plays logged since the first of those losses landed
            burstAvgStake:
              type: number
              description: Average stake across the rapid plays
            stakeRatio:
              type: number
              description: burstAvgStake divided by the bettor's baseline average stake
          required: [windowHours, recentLosses, rapidPlays, burstAvgStake, stakeRatio]
        trendFlip:
          type: boolean
          description: >-
            True while the one-time "trend flipped" celebration is available:
            the reported leak's trend reads non-negative and the user has not
            yet seen the celebratory card. Reading this endpoint never
            consumes the celebration — clients that render the card must POST
            /users/me/leak-celebration-seen, after which responses return
            false and the celebration never repeats.
      required: [settledCount, recentWindowDays, avgStake, lastLossAt, worstSport, overconfidence, topMissReason, tiltSpiral, trendFlip]

