openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EdgeBoard - Sports bet tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bets
    description: Straight bet operations
  - name: parlays
    description: Parlay operations
  - name: bankroll
    description: Bankroll and transaction operations
  - name: stats
    description: Analytics and statistics
  - name: workspace
    description: Shared workspace operations
  - name: users
    description: User operations
  - name: billing
    description: TiltCheck Pro subscription operations
  - name: crews
    description: Crew membership and switching operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the signed-in user's bettor profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
        "404":
          description: Signed in but no bettor profile linked yet

  /users/me/delete:
    post:
      operationId: deleteCurrentUser
      tags: [users]
      summary: Permanently delete the signed-in user's account and all their data
      description: >-
        Irreversible. Removes the bettor profile and everything it owns —
        bets, parlays and legs, bankroll ledger, badges, recap narratives,
        crew memberships, and any invite tied to the account's email. Crews
        the user owns are handed to their longest-standing remaining member;
        crews with no other members are shut down. Other bettors' data is
        never touched. The sign-in account itself is removed as well, so the
        email can register fresh later.
      responses:
        "204":
          description: Account and all associated data deleted
        "401":
          description: Not signed in
        "404":
          description: Signed in but no bettor profile linked yet

  /users/me/recap-seen:
    post:
      operationId: markRecapSeen
      tags: [users]
      summary: Record that the signed-in user has seen the current week's recap
      description: >
        Stores the Monday of the most recently completed week (computed
        server-side, UTC) as the user's seen recap week, so the dashboard
        teaser stays hidden on every device once the recap is opened.
      responses:
        "200":
          description: Updated user with the seen week recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
        "404":
          description: Signed in but no bettor profile linked yet

  /users/me/leak-celebration-seen:
    post:
      operationId: markLeakCelebrationSeen
      tags: [users]
      summary: Record that the signed-in user has seen the one-time leak trend-flip celebration
      description: >
        Consumes the one-time "trend flipped" celebration. Clients must call
        this only after the celebratory card actually rendered, so a
        background fetch of the leak profile (e.g. from the bet form) can
        never silently burn the celebration. Idempotent — the first call
        records the timestamp, later calls are no-ops.
      responses:
        "200":
          description: Updated user with the celebration recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
        "404":
          description: Signed in but no bettor profile linked yet

  /users/unclaimed:
    get:
      operationId: listUnclaimedUsers
      tags: [users]
      summary: List bettor profiles not yet linked to a sign-in account
      responses:
        "200":
          description: Unclaimed profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/claim:
    post:
      operationId: claimProfile
      tags: [users]
      summary: Claim an existing bettor profile or create a fresh one for the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimProfileInput"
      responses:
        "200":
          description: Linked bettor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: >-
            Claim rejected — `error` is `not_invited` (the beta gate is active
            — founder-managed invites table and/or BETA_ALLOWED_EMAILS env var
            — and this account's email is on neither list, or the account has
            no email) or `beta_full` (seat cap reached). The FOUNDER_EMAIL
            account always passes both checks.
        "409":
          description: Profile already claimed or account already linked

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List crew-visible users
      description: >-
        The bettors this session's social surfaces may show: your active
        crew's members (or just yourself when crewless) for real sessions,
        the fictional demo crew for demo sessions. Other users'
        startingBankroll is null — it's private to each bettor.
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update the signed-in user's own profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Cannot update another user's profile
        "404":
          description: Not found

  /users/{id}/badges:
    get:
      operationId: getUserBadges
      tags: [users]
      summary: List all badge definitions with the user's earned status
      description: >
        Returns every badge the app defines, with earnedAt set for the ones
        this bettor has earned. Visiting this endpoint also awards any newly
        qualified badges (badges are never revoked).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Badge case
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BadgeStatus"
        "404":
          description: User not found

  # ── Crews ─────────────────────────────────────────────────────────────────
  /crews:
    get:
      operationId: listCrews
      tags: [crews]
      summary: List the signed-in user's crews
      description: >
        Every crew this bettor belongs to, with their role, the shareable
        invite code, member count, and which crew is currently active (the one
        the leaderboard, head-to-head, and recap highlights cover).
      responses:
        "200":
          description: The user's crews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Crew"
        "403":
          description: No bettor profile linked yet
    post:
      operationId: createCrew
      tags: [crews]
      summary: Create a new crew
      description: >
        Creates a crew owned by the signed-in user and switches them to it.
        The first crew is free; creating another while already in one is part
        of the Pro layer (402 `pro_required` for free accounts — founder and
        live subscriptions pass).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrewInput"
      responses:
        "201":
          description: Created crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crew"
        "402":
          description: Free accounts live in one crew — running more is Pro (`error` is `pro_required`)
        "403":
          description: No bettor profile linked yet

  /crews/join:
    post:
      operationId: joinCrew
      tags: [crews]
      summary: Join a crew with an invite code
      description: >
        Joins the crew behind the invite code and switches to it. Joining your
        first crew is free; joining another while already in one is part of
        the Pro layer (402 `pro_required` for free accounts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCrewInput"
      responses:
        "200":
          description: Joined crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crew"
        "402":
          description: Free accounts live in one crew — running more is Pro (`error` is `pro_required`)
        "404":
          description: No crew matches that invite code
        "409":
          description: Already a member of this crew (`error` is `already_in_crew`)

  /crews/{id}/activate:
    post:
      operationId: activateCrew
      tags: [crews]
      summary: Switch the active crew
      description: >
        Makes this crew the one whose leaderboard, head-to-head, and recap
        highlights the user sees. Must be a member.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The now-active crew
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crew"
        "404":
          description: Not a member of this crew

  /crews/{id}/invite-code:
    post:
      operationId: rotateCrewInviteCode
      tags: [crews]
      summary: Rotate the crew's invite code
      description: >
        Owner only. Replaces the invite code so an old shared link stops
        working. Existing members are unaffected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Crew with the fresh invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crew"
        "403":
          description: Only the crew owner can rotate the code
        "404":
          description: Not a member of this crew

  /crews/{id}:
    delete:
      operationId: deleteCrew
      tags: [crews]
      summary: Delete the crew
      description: >
        Owner only. Shuts the crew down for everyone — memberships cascade,
        and former members fall back to another crew they belong to (or go
        crewless).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Crew deleted
        "403":
          description: Only the crew owner can delete the crew (`error` is `owner_only`)
        "404":
          description: Not a member of this crew

  /crews/{id}/members:
    get:
      operationId: listCrewMembers
      tags: [crews]
      summary: List the crew's members
      description: >
        The crew's roster, visible to any member. Powers the management view
        (remove / transfer targets).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Crew members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrewMember"
        "404":
          description: Not a member of this crew

  /crews/{id}/leave:
    post:
      operationId: leaveCrew
      tags: [crews]
      summary: Leave the crew
      description: >
        Removes the signed-in member from the crew, freeing up their one free
        membership slot. The owner can't leave — they must hand off ownership
        first or delete the crew (409 `owner_cannot_leave`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left the crew
        "404":
          description: Not a member of this crew
        "409":
          description: The owner can't leave — transfer ownership or delete the crew (`error` is `owner_cannot_leave`)

  /crews/{id}/members/{userId}:
    delete:
      operationId: removeCrewMember
      tags: [crews]
      summary: Remove a member from the crew
      description: >
        Owner only. Kicks the member off the board and frees up their
        membership slot. The owner can't remove themselves — that's leave
        (blocked) or delete (409 `cannot_remove_owner`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Member removed
        "403":
          description: Only the crew owner can remove members (`error` is `owner_only`)
        "404":
          description: Not a member of this crew, or the target isn't a member
        "409":
          description: The owner can't remove themselves (`error` is `cannot_remove_owner`)

  /crews/{id}/transfer:
    post:
      operationId: transferCrewOwnership
      tags: [crews]
      summary: Hand crew ownership to another member
      description: >
        Owner only. The target member becomes the owner; the previous owner
        stays in the crew as a regular member.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCrewOwnershipInput"
      responses:
        "200":
          description: The crew, with the caller's role now `member`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crew"
        "403":
          description: Only the crew owner can transfer ownership (`error` is `owner_only`)
        "404":
          description: Not a member of this crew, or the target isn't a member

  # ── Bets ──────────────────────────────────────────────────────────────────
  /bets:
    get:
      operationId: listBets
      tags: [bets]
      summary: List straight bets
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [pending, won, lost, push, void, null]
        - name: sport
          in: query
          schema:
            type: ["string", "null"]
        - name: sportsbook
          in: query
          schema:
            type: ["string", "null"]
        - name: q
          in: query
          description: Case-insensitive text search over event and pick
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          description: Earliest game date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          description: Latest game date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of bets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bet"
    post:
      operationId: createBet
      tags: [bets]
      summary: Create a new straight bet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetInput"
      responses:
        "201":
          description: Created bet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"

  /bets/{id}:
    get:
      operationId: getBet
      tags: [bets]
      summary: Get a single bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bet detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"
        "404":
          description: Not found
    patch:
      operationId: updateBet
      tags: [bets]
      summary: Update a bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetUpdate"
      responses:
        "200":
          description: Updated bet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"
    delete:
      operationId: deleteBet
      tags: [bets]
      summary: Delete a bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /bets/{id}/settle:
    patch:
      operationId: settleBet
      tags: [bets]
      summary: Record result and post-game review for a bet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetSettlement"
      responses:
        "200":
          description: Settled bet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"

  /bets/{id}/unsettle:
    post:
      operationId: unsettleBet
      tags: [bets]
      summary: Reopen a settled bet so a wrong result can be fixed
      description: >
        Owner-only. Returns the bet to pending and appends a compensating
        adjustment to the bankroll ledger reversing the settlement's net
        impact (the ledger is append-only — recorded rows are never
        rewritten). The bet can then be settled again with the correct
        result. Post-game review fields are kept and will be overwritten by
        the next settle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bet returned to pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bet"
        "404":
          description: Bet not found
        "409":
          description: Bet is not settled — nothing to reopen

  # ── Parlays ───────────────────────────────────────────────────────────────
  /parlays:
    get:
      operationId: listParlays
      tags: [parlays]
      summary: List parlays
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: [pending, won, lost, push, void, null]
        - name: sport
          in: query
          description: Match parlays with at least one leg in this sport
          schema:
            type: ["string", "null"]
        - name: sportsbook
          in: query
          schema:
            type: ["string", "null"]
        - name: q
          in: query
          description: Case-insensitive text search over parlay name and leg event/pick
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          description: Earliest creation date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          description: Latest creation date (inclusive, YYYY-MM-DD)
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of parlays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parlay"
    post:
      operationId: createParlay
      tags: [parlays]
      summary: Create a parlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlayInput"
      responses:
        "201":
          description: Created parlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"

  /parlays/{id}:
    get:
      operationId: getParlay
      tags: [parlays]
      summary: Get a parlay with its legs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Parlay detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
        "404":
          description: Not found
    patch:
      operationId: updateParlay
      tags: [parlays]
      summary: Update a parlay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlayUpdate"
      responses:
        "200":
          description: Updated parlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
    delete:
      operationId: deleteParlay
      tags: [parlays]
      summary: Delete a parlay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /parlays/{id}/legs/{legId}:
    patch:
      operationId: updateParlayLeg
      tags: [parlays]
      summary: Correct a pending parlay leg's odds and recompute the parlay's combined odds and payout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: legId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlayLegUpdate"
      responses:
        "200":
          description: Parlay with the corrected leg and recomputed combined odds/payout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
        "404":
          description: Parlay or leg not found
        "409":
          description: Parlay is already settled — its payout is part of the bankroll ledger and legs cannot be edited

  /parlays/{id}/recompute-odds:
    post:
      operationId: recomputeParlayOdds
      tags: [parlays]
      summary: Recompute a pending parlay's combined odds and payout from its legs
      description: >
        For parlays whose stored combined odds are wrong (e.g. an impossible
        dead-zone price) while every leg carries a valid price. Owner-only and
        pending-only — a settled parlay's payout is already part of the
        bankroll ledger. Recomputes the combined odds and potential payout
        from the legs exactly like a leg correction does.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Parlay with recomputed combined odds and payout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
        "400":
          description: One or more legs still carry invalid odds — correct the legs first
        "404":
          description: Parlay not found
        "409":
          description: Parlay is already settled — its payout is part of the bankroll ledger

  /parlays/{id}/settle:
    patch:
      operationId: settleParlay
      tags: [parlays]
      summary: Settle a parlay result and add review
      description: >
        Settles the parlay and moves the bankroll. Pushed or voided legs are
        removed from the ticket the way books settle it: a parlay graded
        "won" pays from the combined odds of the remaining legs only, not
        the original full-ticket odds. If every leg pushed or voided, the
        parlay cannot be "won" — settle it as push (stake refunded).
        `actualPayoutOverride` still wins when provided (promo boosts).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParlaySettlement"
      responses:
        "200":
          description: Settled parlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"

  /parlays/{id}/unsettle:
    post:
      operationId: unsettleParlay
      tags: [parlays]
      summary: Reopen a settled parlay so a wrong result can be fixed
      description: >
        Owner-only. Returns the parlay and all of its legs to pending and
        appends a compensating adjustment to the bankroll ledger reversing
        the settlement's net impact (the ledger is append-only — recorded
        rows are never rewritten). The parlay can then be settled again with
        the correct result. Post-game review fields are kept and will be
        overwritten by the next settle.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Parlay returned to pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parlay"
        "404":
          description: Parlay not found
        "409":
          description: Parlay is not settled — nothing to reopen

  /settlement/needs-settling:
    get:
      operationId: getNeedsSettling
      tags: [bets]
      summary: List the signed-in user's pending bets and parlays whose games are already over
      description: >
        Returns pending straight bets whose game date is before today, and
        pending parlays whose every leg's game date is before today, for the
        signed-in user only. Used to nudge bettors to settle finished games.
        "Today" is evaluated in the bettor's own timezone when `tz` is
        provided (an IANA timezone like "America/Los_Angeles"), so a bet
        stops counting as unsettled only after its game date has actually
        ended for the user — not at UTC midnight. An invalid or missing `tz`
        falls back to UTC.
      parameters:
        - name: tz
          in: query
          required: false
          schema:
            type: ["string", "null"]
            maxLength: 64
          description: IANA timezone of the bettor's browser (e.g. "America/Los_Angeles"). Invalid values fall back to UTC.
      responses:
        "200":
          description: Items awaiting settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsSettling"
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  # ── CSV exports ───────────────────────────────────────────────────────────
  /export/bets.csv:
    get:
      operationId: exportBetsCsv
      tags: [bets]
      summary: Download the signed-in user's straight bets as a CSV file
      description: >
        Returns every straight bet owned by the signed-in user as CSV with a
        header row, RFC 4180 escaping, and ISO dates. Ordered oldest-first so
        spreadsheets read chronologically.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  /export/parlays.csv:
    get:
      operationId: exportParlaysCsv
      tags: [parlays]
      summary: Download the signed-in user's parlays as a CSV file (one row per leg)
      description: >
        Returns every parlay owned by the signed-in user as CSV with one row
        per leg; parlay-level columns repeat on each leg row so spreadsheets
        can pivot on the parlay id.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  /export/bankroll.csv:
    get:
      operationId: exportTransactionsCsv
      tags: [bankroll]
      summary: Download the signed-in user's bankroll transactions as a CSV file
      description: >
        Returns the signed-in user's full bankroll ledger as CSV with a header
        row, RFC 4180 escaping, and ISO dates. Ordered oldest-first.
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  # ── Bankroll ──────────────────────────────────────────────────────────────
  /bankroll:
    get:
      operationId: getBankroll
      tags: [bankroll]
      summary: Get current bankroll state for a user
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Bankroll state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bankroll"

  /bankroll/transactions:
    get:
      operationId: listTransactions
      tags: [bankroll]
      summary: List bankroll transactions
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Number of transactions to skip, for paging through long ledgers
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [bankroll]
      summary: Add a bankroll transaction (deposit, withdraw, adjustment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /bankroll/history:
    get:
      operationId: getBankrollHistory
      tags: [bankroll]
      summary: Full bankroll balance history for the signed-in user
      description: >
        Returns every ledger point in chronological order so the client can
        chart the balance over time. Always scoped to the signed-in user; a
        userId param is only accepted when it matches the session user.
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Bankroll history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankrollHistory"

  # ── Stats (wow endpoints) ─────────────────────────────────────────────────
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Overall performance summary for a user
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/by-sport:
    get:
      operationId: getStatsBySport
      tags: [stats]
      summary: Win/loss and ROI broken down by sport
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Stats by sport
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SportStats"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Recent bets and parlays activity feed across the workspace
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /stats/confidence-analysis:
    get:
      operationId: getConfidenceAnalysis
      tags: [stats]
      summary: How well confidence scores predict outcomes
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Confidence analysis buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfidenceBucket"

  /stats/insights:
    get:
      operationId: getStatsInsights
      tags: [stats]
      summary: Post-result review insights (miss reasons, reasoning quality, recent notes)
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Review insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsResponse"

  /stats/lessons:
    get:
      operationId: getLessons
      tags: [stats]
      summary: The bettor's full post-mortem history for the Lesson Library
      description: >
        Every settled bet and parlay (won/lost/push) for the signed-in bettor,
        with the journal fields that make a post-mortem — confidence,
        rationale, reasoning quality, miss reason, and the "what happened"
        note — plus aggregate counts for the summary strip. This is self-audit
        data: a userId param is only accepted when it matches the session user
        (the demo mount browses as the demo crew's point-of-view member).
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Lesson Library feed and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonsResponse"
        "401":
          description: Not signed in
        "403":
          description: You can only review your own lessons

  /stats/leak-profile:
    get:
      operationId: getLeakProfile
      tags: [stats]
      summary: A bettor's recurring leak signals for pre-bet warnings
      description: >
        Aggregates the signed-in bettor's settled history into a few
        machine-readable leak signals (stake chasing after a loss, worst
        sport, overconfidence) so the bet form can warn before they repeat
        their most common mistake. Signals below sample-size thresholds are
        omitted. Always scoped to the signed-in user.
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Leak profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeakProfile"

  /stats/edge-finder:
    get:
      operationId: getEdgeFinder
      tags: [stats]
      summary: A bettor's settled history sliced into lanes to find their edge
      description: >
        Slices the signed-in bettor's settled straight bets (valid odds only)
        into lanes — by sport, favorite vs underdog, odds band, day of week,
        and stake size band — each with record, money wagered, net profit, and
        ROI, so the Edge Finder page can show where they actually make money.
        Always scoped to the signed-in user; a userId param is only accepted
        when it matches the session user. Optional filters narrow the slice:
        period (settled in the last 7/30 days) and sport.
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: period
          in: query
          description: Time window over settledAt — week (7 days), month (30 days), or all history
          schema:
            type: string
            enum: [week, month, all]
        - name: sport
          in: query
          description: Only bets in this sport (exact match)
          schema:
            type: string
      responses:
        "200":
          description: Edge finder lanes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgeFinder"

  /stats/recap:
    get:
      operationId: getWeeklyRecap
      tags: [stats]
      summary: Weekly recap facts for a bettor plus the crew's highlights
      description: >
        Computes recap facts for one Monday-to-Sunday week (UTC) from settled
        plays. Defaults to the signed-in bettor and the most recently
        completed week. weekStart accepts any date and snaps to its Monday;
        weeks after the last completed week are rejected.
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: weekStart
          in: query
          description: Any date inside the desired week (YYYY-MM-DD)
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Weekly recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyRecap"
        "400":
          description: Week not finished yet or invalid date

  /stats/recap/narrative:
    get:
      operationId: getRecapNarrative
      tags: [stats]
      summary: AI-narrated review of a bettor's week
      description: >
        Returns a short written review of the bettor's week in EdgeBoard's
        voice, generated from the same computed recap facts the recap page
        shows (never from raw bets) and cached per user per week. When the
        week had no activity or generation is unavailable, `narrative` is
        null — the recap page simply omits the section.
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: weekStart
          in: query
          description: Any date inside the desired week (YYYY-MM-DD)
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Narrative review (or null when unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecapNarrative"
        "400":
          description: Week not finished yet or invalid date

  /stats/streaks:
    get:
      operationId: getStreaks
      tags: [stats]
      summary: Logging streak and settle streak for a bettor
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Streaks summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreaksSummary"

  # ── Workspace ─────────────────────────────────────────────────────────────
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get workspace info and members
      responses:
        "200":
          description: Workspace with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /workspace/compare:
    get:
      operationId: compareWorkspaceMembers
      tags: [workspace]
      summary: Compare bets and stats between workspace members
      description: >
        Head-to-head comparison rows for every workspace member. Money math
        includes settled straight bets AND parlays (won/lost/push), excludes
        dead-zone-odds rows, and honors the same settledAt window as the
        leaderboard: week = last 7 days, month = last 30 days, all = everything.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, all]
            default: all
      responses:
        "200":
          description: Member comparison data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberComparison"

  /workspace/leaderboard:
    get:
      operationId: getWorkspaceLeaderboard
      tags: [workspace]
      summary: Rank crew members by settled results over a time window
      description: >
        Ranks every workspace member by net profit (ties broken by ROI, then
        wins) using settled straight bets and parlays only — pending plays are
        reported as an "in play" count and never move the ranking. Rows saved
        with dead-zone odds are excluded the same way the stats endpoints
        exclude them. The window filters on settledAt: week = last 7 days,
        month = last 30 days, all = everything.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, all]
            default: all
      responses:
        "200":
          description: Ranked leaderboard rows, best record first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet

  # ── Billing ────────────────────────────────────────────────────────────────
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: TiltCheck Pro status for the signed-in bettor
      description: >
        Server-verified subscription status. When the cached horizon has
        expired, the server re-checks the payment provider and stores the new
        horizon — Pro access is never granted from client state, redirects, or
        checkout IDs. Founders are always Pro; the demo board reports Pro so
        the public demo shows the full product.
      responses:
        "200":
          description: Verified subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet
        "503":
          description: Payment provider unreachable and no valid cached horizon

  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a hosted checkout session for TiltCheck Pro
      description: >
        Creates a Whop hosted-checkout session bound to this bettor and returns
        the URL to redirect to. The checkout configuration id is stored on the
        profile so the resulting payment can be verified server-side after the
        redirect — the redirect itself never grants access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutInput"
      responses:
        "200":
          description: Hosted checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckout"
        "400":
          description: Invalid return URL
        "401":
          description: Not signed in
        "403":
          description: Signed in but no bettor profile linked yet
        "409":
          description: Already subscribed (founders included — Pro comes with the crown)
        "503":
          description: Payment provider unreachable

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Founder dashboard overview — seats, invites, and crew activity
      responses:
        "200":
          description: Founder overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Signed in but not the founder

  /admin/invites:
    get:
      operationId: listInvites
      tags: [admin]
      summary: List beta invite emails
      responses:
        "200":
          description: Invite list, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "403":
          description: Signed in but not the founder
    post:
      operationId: createInvite
      tags: [admin]
      summary: Invite an email to the beta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "403":
          description: Signed in but not the founder
        "409":
          description: Email already invited

  /admin/invites/{id}:
    delete:
      operationId: deleteInvite
      tags: [admin]
      summary: Remove an invite (does not unlink accounts that already claimed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Invite removed
        "403":
          description: Signed in but not the founder
        "404":
          description: Invite not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatarColor:
          type: string
        startingBankroll:
          type: ["number", "null"]
          description: >-
            Starting bankroll is private — null when this row describes
            another bettor in the user list. Always present on your own
            profile (/users/me, claim, update) and on unclaimed profiles.
        createdAt:
          type: string
        recapSeenWeek:
          type: ["string", "null"]
          description: Monday (YYYY-MM-DD, UTC) of the last recap week this user opened, or null if never
        isFounder:
          type: boolean
          description: Founder of the board — can manage beta invites and see the founder dashboard
        oddsFormat:
          type: string
          enum: [american, decimal, fractional]
          description: Preferred odds display format — follows the user across devices
      required: [id, username, displayName, avatarColor, startingBankroll, createdAt, isFounder, oddsFormat]

    BillingStatus:
      type: object
      properties:
        isPro:
          type: boolean
        proUntil:
          type: ["string", "null"]
          description: End of the server-verified subscription horizon (ISO timestamp); null when Pro comes from founder/demo status or the account isn't Pro
        source:
          type: string
          enum: [subscription, founder, demo, none]
          description: Why the account is (or isn't) Pro
      required: [isPro, proUntil, source]

    BillingCheckoutInput:
      type: object
      properties:
        returnUrl:
          type: string
          description: Absolute http(s) URL the hosted checkout redirects back to after payment
      required: [returnUrl]

    BillingCheckout:
      type: object
      properties:
        checkoutUrl:
          type: string
          description: Whop hosted checkout URL to send the buyer to
      required: [checkoutUrl]

    Crew:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
          description: The signed-in user's role in this crew
        inviteCode:
          type: string
          description: Shareable join code — sharing it is free, joining may need Pro
        memberCount:
          type: integer
        isActive:
          type: boolean
          description: Whether this is the crew the user's social views currently cover
        createdAt:
          type: string
      required: [id, name, role, inviteCode, memberCount, isActive, createdAt]

    CreateCrewInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Crew name shown on the leaderboard header and switcher
      required: [name]

    JoinCrewInput:
      type: object
      properties:
        inviteCode:
          type: string
          minLength: 4
          maxLength: 16
          description: Invite code shared by a crew member (case-insensitive)
      required: [inviteCode]

    CrewMember:
      type: object
      properties:
        userId:
          type: integer
        displayName:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [owner, member]
        joinedAt:
          type: string
      required: [userId, displayName, username, role, joinedAt]

    TransferCrewOwnershipInput:
      type: object
      properties:
        userId:
          type: integer
          description: The member who takes over as owner
      required: [userId]

    Invite:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        claimed:
          type: boolean
          description: Whether a linked account with this email exists
        createdAt:
          type: string
      required: [id, email, claimed, createdAt]

    InviteInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Email address (validated server-side)
      required: [email]

    AdminMember:
      type: object
      properties:
        userId:
          type: integer
        displayName:
          type: string
        avatarColor:
          type: string
        email:
          type: ["string", "null"]
        linked:
          type: boolean
          description: Whether a sign-in account is attached to this profile
        isFounder:
          type: boolean
        playsLogged:
          type: number
          description: Straight bets + parlays logged, all time
        playsThisWeek:
          type: number
          description: Plays logged since Monday (UTC)
        totalWagered:
          type: number
        lastPlayAt:
          type: ["string", "null"]
          description: When this member last logged a play, or null if never
      required: [userId, displayName, avatarColor, email, linked, isFounder, playsLogged, playsThisWeek, totalWagered, lastPlayAt]

    AdminOverview:
      type: object
      properties:
        betaLocked:
          type: boolean
          description: True when an invite list (DB or env) is active, so new sign-ups are restricted
        linkedSeats:
          type: number
        invitesOutstanding:
          type: number
          description: Invited emails that have not claimed a profile yet
        playsThisWeek:
          type: number
        wageredThisWeek:
          type: number
        totalPlays:
          type: number
        totalWagered:
          type: number
        members:
          type: array
          items:
            $ref: "#/components/schemas/AdminMember"
      required: [betaLocked, linkedSeats, invitesOutstanding, playsThisWeek, wageredThisWeek, totalPlays, totalWagered, members]

    ClaimProfileInput:
      type: object
      description: Provide userId to claim an existing unclaimed profile, or displayName to start fresh
      properties:
        userId:
          type: integer
        displayName:
          type: string
          minLength: 1

    UpdateUserInput:
      type: object
      description: All fields optional; only provided fields are updated
      properties:
        startingBankroll:
          type: number
          exclusiveMinimum: 0
        displayName:
          type: string
          minLength: 1
        avatarColor:
          type: string
        oddsFormat:
          type: string
          enum: [american, decimal, fractional]
          description: Preferred odds display format — follows the user across devices

    NeedsSettling:
      type: object
      required: [count, bets, parlays]
      properties:
        count:
          type: integer
          description: Total number of bets + parlays awaiting settlement
        bets:
          type: array
          items:
            $ref: "#/components/schemas/Bet"
        parlays:
          type: array
          items:
            $ref: "#/components/schemas/Parlay"

    Bet:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        sport:
          type: string
        event:
          type: string
        betType:
          type: string
          enum: [moneyline, spread, total, prop, futures]
        pick:
          type: string
        odds:
          type: integer
          description: American odds (e.g. -110, +150)
        stake:
          type: number
        potentialPayout:
          type: number
        actualPayout:
          type: ["number", "null"]
        status:
          type: string
          enum: [pending, won, lost, push, void]
        gameDate:
          type: string
        confidenceScore:
          type: integer
          description: 1-10 confidence rating
        rationale:
          type: ["string", "null"]
          description: Pre-game reasoning
        postGameReview:
          type: ["string", "null"]
          description: Post-game reflection
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
        settledAt:
          type: ["string", "null"]
        sportsbook:
          type: ["string", "null"]
        promoNote:
          type: ["string", "null"]
        reasoningQuality:
          type: ["string", "null"]
        whatHappened:
          type: ["string", "null"]
        missReason:
          type: ["string", "null"]
