services:
  - type: web
    name: tiltcheck-beta
    runtime: node
    region: ohio
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.34.5 --activate && pnpm install --frozen-lockfile && pnpm run build && pnpm --filter @workspace/db run push
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tiltcheck-db
          property: connectionString
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BETA_SEAT_LIMIT
        value: "0"
      - key: BASE_PATH
        value: "/"
      - key: FOUNDER_EMAIL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: tiltcheck-db
    region: ohio
    plan: free
    databaseName: tiltcheck
    user: tiltcheck
    ipAllowList: []
